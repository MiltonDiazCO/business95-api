services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

    image: business95-api:dev

    ports:
      - "127.0.0.1:${APP_PORT}:8080"

    volumes:
      - ./:/app

  frontend:
    build:
      context: ../business95-front
      dockerfile: Dockerfile.dev

    image: business95-front:dev

    ports:
      - "127.0.0.1:${FRONT_PORT}:5173"

    volumes:
      - ../business95-front:/app
      - node_modules:/app/node_modules # evita que sobrescriba el node_modules del host

    command: npm run dev -- --host

volumes:
  node_modules:
