spring.application.name=business95-api

# --- Configuración de la conexión a la base de datos ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Configuración de JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Configuración de mensajes (i18n / validaciones) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Configuración de nombres del objeto Pageable
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=limite
spring.data.web.sort.sort-parameter=orden