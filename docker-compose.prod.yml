services:
  mysql:
    ports:
      - "${MYSQL_BIND_ADDRESS}:${MYSQL_PORT}:3306"
    
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    
    image: business95-api:1.0

    ports:
      - "${APP_BIND_ADDRESS}:${APP_PORT}:8080"
    
  frontend:
    build:
      context: ../business95-front
      dockerfile: Dockerfile
      
    image: business95-front:1.0
    
    ports:
      - "${FRONT_BIND_ADDRESS}:${FRONT_PORT}:80"
