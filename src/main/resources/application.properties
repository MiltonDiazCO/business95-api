# --- Configuración de la conexión a la base de datos ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dev_business_95
spring.datasource.username=root
spring.datasource.password=

# --- Configuración de JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.datasource.hikari.initializationFailTimeout=60000

# --- Configuración del contexto de la API ---
server.servlet.context-path=/api/v1

# --- Configuración de mensajes (i18n / validaciones) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Configuración de nombres del objeto Pageable
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=limite
spring.data.web.sort.sort-parameter=orden