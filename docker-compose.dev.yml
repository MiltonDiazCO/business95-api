services:
  mysql:
    ports:
      - "${MYSQL_BIND_ADDRESS}:${MYSQL_PORT}:3306"

  frontend:
    build:
      context: ../business95-front
      dockerfile: Dockerfile.dev

    image: business95-front:dev

    ports:
      - "${FRONT_BIND_ADDRESS}:${FRONT_PORT}:5173"

    volumes:
      - ../business95-front:/app
      - node_modules:/app/node_modules # evita que sobrescriba el node_modules del host

    command: npm run dev -- --host

volumes:
  node_modules:
